
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Μισθολόγιο Εξωτερικής Φρουράς - Τελικό</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>Μισθολόγιο Εξωτερικής Φρουράς</h1>
<p>Υπολογισμός μισθών & ετήσιου φόρου 2026</p>
</header>

<nav class="tabs">
<button class="tablinks" onclick="openTab(event,'Employee')">Στοιχεία Εργαζόμενου</button>
<button class="tablinks" onclick="openTab(event,'Extras')">Επιδόματα / Νύχτες</button>
<button class="tablinks" onclick="openTab(event,'Result')">Υπολογισμός</button>
</nav>

<section id="Employee" class="tabcontent">
<div class="control">
<label>Ημερομηνία Πρόσληψης:</label>
<input type="date" id="hireDate" value="2000-07-20">
</div>
<div class="control">
<label>Έτη Υπηρεσίας:</label>
<input type="number" id="yearsService" min="0" max="40" value="26">
</div>
<div class="control">
<label>Βαθμός:</label>
<select id="grade">
<option value="Υπαρχιφύλακας Α">Υπαρχιφύλακας Α</option>
<option value="Υπαρχιφύλακας Β">Υπαρχιφύλακας Β</option>
</select>
</div>
<div class="control">
<label>Ηλικία εργαζόμενου:</label>
<select id="employeeAge">
<option value="<25">Μέχρι 25</option>
<option value="26-30">26-30</option>
<option value=">30">31 και πάνω</option>
</select>
</div>
<div class="control">
<label>Οικογενειακή κατάσταση:</label>
<select id="familyStatus">
<option value="single">Άγαμος</option>
<option value="married">Έγγαμος χωρίς παιδιά</option>
<option value="marriedKids">Έγγαμος με παιδιά</option>
</select>
</div>

<div class="control">
<label>Αριθμός παιδιών:</label>
<select id="numChildren">
<option value="0">0</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6+</option>
</select>
</div>

<div class="control">
<label>Ασφαλισμένος πριν/μετά 1993:</label>
<select id="insured">
<option value="before1993">Παλαιός (πριν 1993)</option>
<option value="after1993">Νέος (μετά 1993)</option>
</select>
</div>
</section>

<section id="Extras" class="tabcontent">
<div class="control">
<label>Νύχτες:</label>
<input type="number" id="nights" min="0" value="0">
</div>
<div class="control">
<label>Πενθήμερα:</label>
<input type="number" id="fiveDays" min="0" value="0">
</div>
<div class="control">
<label>Αναγνώριση 5ετίας:</label>
<select id="fiveYear">
<option value="no">Όχι</option>
<option value="yes">Ναι</option>
</select>
</div>
</section>

<section id="Result" class="tabcontent">
<table id="salaryTable">
<thead>
<tr>
<th>Κλιμάκιο</th><th>Βασικός Μισθός</th><th>Ειδικό Επίδομα</th><th>Οικογενειακή Παροχή</th>
<th>Σύνολο Μηνιαίο</th><th>Κρατήσεις Μηνιαίες</th><th>Φόρος Ετήσιος</th><th>Φόρος Μηνιαίος</th><th>Καθαρό Μηνιαίο</th>
<th>Νύχτες</th><th>Πενθήμερα</th><th>Τελικό Μηνιαίο</th>
</tr>
</thead>
<tbody></tbody>
</table>
</section>

<footer>
<p>Μερκούριος Κερμανίδης – <a href="mailto:merkos1969@gmail.com">merkos1969@gmail.com</a></p>
</footer>

<script>
function openTab(evt, tabName) {
  var i, tabcontent, tablinks;
  tabcontent = document.getElementsByClassName("tabcontent");
  for(i=0;i<tabcontent.length;i++){tabcontent[i].style.display="none";}
  tablinks = document.getElementsByClassName("tablinks");
  for(i=0;i<tablinks.length;i++){tablinks[i].className=tablinks[i].className.replace(" active","");}
  document.getElementById(tabName).style.display="block";
  evt.currentTarget.className+=" active";
}
document.addEventListener("DOMContentLoaded",()=>{document.getElementsByClassName("tablinks")[0].click(); calculate();});

const rates={TPDY:0.04,TEADY:0.03,Health:0.0205,EFKA:0.0667,Unemp:0.02};
const nightRate=20.35; const fiveDayRate=36.06; const fiveYearAmount=39.87;

const salaryData = [
{years:26, grade:'Υπαρχιφύλακας Α', klimakio:13, basic:1885, special:310, familyBase:70}
];

function calculate(){
    const tbody=document.querySelector('#salaryTable tbody');
    tbody.innerHTML='';
    const years=parseInt(document.getElementById('yearsService').value)||0;
    const grade=document.getElementById('grade').value;
    const ageCat=document.getElementById('employeeAge').value;
    const family=document.getElementById('familyStatus').value;
    const nights=parseFloat(document.getElementById('nights').value)||0;
    const fiveDays=parseFloat(document.getElementById('fiveDays').value)||0;
    const fiveYear=document.getElementById('fiveYear').value==='yes';
    const numChildren=parseInt(document.getElementById('numChildren').value)||0;
    const insured=document.getElementById('insured').value;

    const row = salaryData.find(r=>r.years===years && r.grade===grade);
    if(!row) return;

    let familyAllowance = family==='marriedKids'?row.familyBase*numChildren:0;
    let monthlyGross = row.basic + row.special + familyAllowance;
    let mtpyBasic=row.basic*0.045;
    let mtpyAllowance=(insured==='before1993'?0.015:0.045)*(row.special);
    let fiveYearDeduction=fiveYear?fiveYearAmount:0;
    let monthlyDeductions=monthlyGross*rates.TPDY+monthlyGross*rates.TEADY+monthlyGross*rates.Health+monthlyGross*rates.EFKA+monthlyGross*rates.Unemp+mtpyBasic+mtpyAllowance+fiveYearDeduction;
    
    let annualGross = monthlyGross*12;
    let annualDeductions = monthlyDeductions*12;
    let ageFactor = 0.28;
    if(ageCat=='<25') ageFactor=0.24;
    else if(ageCat=='26-30') ageFactor=0.26;
    let childDiscount = numChildren*200;
    let annualTax=Math.max(0,(annualGross-annualDeductions)*ageFactor - childDiscount);
    let monthlyTax = annualTax/12;

    let net = monthlyGross - monthlyDeductions - monthlyTax;
    let nightTotal=nights*nightRate;
    let fiveDayTotal=fiveDays*fiveDayRate;
    let finalNet = net + nightTotal + fiveDayTotal;

    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${row.klimakio}</td><td>${row.basic}</td><td>${row.special}</td><td>${familyAllowance}</td><td>${monthlyGross.toFixed(2)}</td><td>${monthlyDeductions.toFixed(2)}</td><td>${annualTax.toFixed(2)}</td><td>${monthlyTax.toFixed(2)}</td><td>${net.toFixed(2)}</td><td>${nightTotal.toFixed(2)}</td><td>${fiveDayTotal.toFixed(2)}</td><td>${finalNet.toFixed(2)}</td>`;
    tbody.appendChild(tr);
}
document.querySelectorAll('input, select').forEach(el=>el.addEventListener('input', calculate));
</script>

</body>
</html>
